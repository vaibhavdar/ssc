workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Show project structure
        script: find . -name "gradlew" | head -5 && echo "---" && ls -la
      - name: Set gradlew permission and Build
        script: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found gradlew at: $GRADLEW_PATH"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/app/build/outputs/apk/debug/app-debug.apk"
